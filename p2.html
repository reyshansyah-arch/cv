<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam - Kecerahan</title>

    <style>
        video, canvas {
            width: 400px;
            max-width: 100%;
            display: block;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            margin-right: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #hasil {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Deteksi Kecerahan Webcam</h2>

    <!-- Webcam -->
    <video id="cam" autoplay playsinline></video>

    <!-- Canvas untuk menyimpan frame -->
    <canvas id="frame"></canvas>

    <button onclick="mulaiKamera()">Mulai Kamera</button>
    <button onclick="matikanKamera()">Matikan Kamera</button>
    <button onclick="prosesFrame()">Ambil Frame</button>
    <button onclick="ratakanKecerahanFrame()">Ratakan Kecerahan</button>

    <div id="hasil">
        Kecerahan: -
    </div>

    <script>
        let video;
        let mediaStream = null;

        // Menyalakan kamera
        async function mulaiKamera() {
            try {
                video = document.getElementById('cam');

                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });

                video.srcObject = mediaStream;
                await video.play();

                console.log("Kamera berhasil dinyalakan");

            } catch (error) {
                console.error("Gagal mengakses kamera:", error);
                alert("Kamera tidak dapat diakses. Pastikan web dijalankan di localhost/HTTPS dan izin diberikan.");
            }
        }

        // Mematikan kamera
        function matikanKamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                mediaStream = null;
                document.getElementById('hasil').innerText = "Kecerahan: -";
                console.log("Kamera dimatikan");
            } else {
                alert("Kamera belum menyala.");
            }
        }

        // Mengambil frame dari video
        function ambilFrame(video, canvas) {
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            return ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        // Menghitung rata-rata kecerahan
        function rataKecerahan(imageData) {
            const d = imageData.data;
            let total = 0;

            for (let i = 0; i < d.length; i += 4) {
                const merah = d[i];
                const hijau = d[i + 1];
                const biru = d[i + 2];

                const brightness = (0.299 * merah) + (0.587 * hijau) + (0.114 * biru);
                total += brightness;
            }

            const jumlahPixel = d.length / 4;
            return total / jumlahPixel;
        }

        // Proses frame dan tampilkan kecerahan
        function prosesFrame() {
            if (!video || video.videoWidth === 0 || !mediaStream) {
                alert("Silakan nyalakan kamera terlebih dahulu.");
                return;
            }

            const canvas = document.getElementById('frame');
            const imageData = ambilFrame(video, canvas);
            const brightness = rataKecerahan(imageData);

            document.getElementById('hasil').innerText = "Kecerahan: " + brightness.toFixed(2) + " / 255";
        }

        // Meratakan/menyeimbangkan kecerahan (Histogram Stretching)
        function ratakanKecerahanFrame() {
            if (!video || video.videoWidth === 0 || !mediaStream) {
                alert("Silakan nyalakan kamera terlebih dahulu.");
                return;
            }

            const canvas = document.getElementById('frame');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imageData.data;

            let minVal = 255;
            let maxVal = 0;

            // Cari nilai intensitas minimum dan maksimum pada frame
            for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                if (gray < minVal) minVal = gray;
                if (gray > maxVal) maxVal = gray;
            }

            // Hindari pembagian dengan nol jika gambar terlalu seragam
            if (maxVal === minVal) maxVal = minVal + 1;

            // Rentangkan nilai pixel (Contrast Stretching)
            for (let i = 0; i < d.length; i += 4) {
                d[i]     = Math.min(255, Math.max(0, ((d[i] - minVal) * 255) / (maxVal - minVal)));         // Merah
                d[i + 1] = Math.min(255, Math.max(0, ((d[i + 1] - minVal) * 255) / (maxVal - minVal)));     // Hijau
                d[i + 2] = Math.min(255, Math.max(0, ((d[i + 2] - minVal) * 255) / (maxVal - minVal)));     // Biru
            }

            // Masukkan kembali data pixel yang sudah diratakan ke canvas
            ctx.putImageData(imageData, 0, 0);

            // Hitung ulang dan tampilkan kecerahan setelah diratakan
            const newBrightness = rataKecerahan(imageData);
            document.getElementById('hasil').innerText = "Kecerahan (Diratakan): " + newBrightness.toFixed(2) + " / 255";
        }
    </script>

</body>
</html>
